<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Calisthenics Lab — browser-only skeletal movement tracking">
  <title>Calisthenics Lab — tracked handstand push-ups, pull-ups, pistol squats and L-sits</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#2a2c31"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="10%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="94%" cy="98%" r="64%">
      <stop offset="0%" stop-color="#96a5be" stop-opacity="0.09"/>
      <stop offset="70%" stop-color="#96a5be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeFloor" gradientUnits="userSpaceOnUse" x1="-165" y1="0" x2="165" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBar" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="150" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; fill: rgba(255,255,255,0.92); }
    .h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.028em; fill: #ffffff; }
    .sub { font-size: 15px; font-weight: 400; letter-spacing: -0.005em; fill: rgba(255,255,255,0.63); }
    .move { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; fill: #4ade80; fill-opacity: 0.9; }
  </style>

  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="18" fill="url(#glowTop)"/>
  <rect width="1200" height="460" rx="18" fill="url(#glowCool)"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(80, 62)">
    <text x="0" y="0" class="ui brand">Calisthenics Lab</text>
  </g>
  <text class="ui h1" x="80" y="190">Teach the machine</text>
  <text class="ui h1" x="80" y="240">what a real rep looks like</text>
  <text class="ui h1" x="80" y="290">for any calisthenics move.</text>
  <text class="ui sub" x="80" y="338">Browser-only skeletal tracking. No video kept. An open library for movement.</text>

