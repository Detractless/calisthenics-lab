<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Calisthenics Lab — browser-only skeletal movement tracking">
  <title>Calisthenics Lab — tracked handstand push-ups, pull-ups, pistol squats and L-sits</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#2a2c31"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="10%" cy="6%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="94%" cy="98%" r="64%">
      <stop offset="0%" stop-color="#96a5be" stop-opacity="0.09"/>
      <stop offset="70%" stop-color="#96a5be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeFloor" gradientUnits="userSpaceOnUse" x1="-165" y1="0" x2="165" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBar" gradientUnits="userSpaceOnUse" x1="-150" y1="0" x2="150" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; fill: rgba(255,255,255,0.92); }
    .h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.028em; fill: #ffffff; }
    .sub { font-size: 15px; font-weight: 400; letter-spacing: -0.005em; fill: rgba(255,255,255,0.63); }
    .move { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; fill: #4ade80; fill-opacity: 0.9; }
  </style>

  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="18" fill="url(#glowTop)"/>
  <rect width="1200" height="460" rx="18" fill="url(#glowCool)"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <text class="ui h1" x="80" y="78">Teach the machine</text>
  <text class="ui h1" x="80" y="128">what a real rep looks like</text>
  <text class="ui h1" x="80" y="178">for any calisthenics move.</text>
  <text class="ui" x="80" y="302" font-size="18" font-weight="600" fill="#4ade80">Record your movement in the live demo ↓</text>
  <text class="ui sub" x="80" y="330">Help build an open library of movement.</text>
  <text class="ui sub" x="80" y="416">Browser-only skeletal tracking. No video kept. An open library for movement.</text>

  <g transform="translate(906, 372)">
    <ellipse cx="0" cy="-130" rx="145" ry="185" fill="url(#glowPose)"/>
    <line x1="-165" y1="0" x2="165" y2="0" stroke="url(#fadeFloor)" stroke-width="1.6"/>

    <!-- ================= HANDSTAND PUSH-UP ================= -->
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23077;0.25;0.98077;1" dur="26s" repeatCount="indefinite"/>
      <g filter="url(#softGlow)">
        <path d="M-18 -56 Q0 -64 18 -56 L11 -122 Q0 -128 -11 -122 Z" fill="#4ade80" fill-opacity="0.17"/>
        <g fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-18 -56 L-26 -27 L-21 0 M18 -56 L26 -27 L21 0"/>
          <path d="M-18 -56 L-11 -122 L-14 -152 L-18 -192 M18 -56 L11 -122 L14 -152 L18 -192 M-18 -56 L18 -56 M-11 -122 L11 -122 M0 -44 L0 -56"/>
        </g>
        <g fill="#fbbf24">
          <circle cx="-18" cy="-56" r="3.3"/><circle cx="18" cy="-56" r="3.3"/>
          <circle cx="-26" cy="-27" r="3.3"/><circle cx="26" cy="-27" r="3.3"/>
          <circle cx="-21" cy="0" r="3.3"/><circle cx="21" cy="0" r="3.3"/>
          <circle cx="-11" cy="-122" r="3.3"/><circle cx="11" cy="-122" r="3.3"/>
        </g>
        <circle cx="0" cy="-34" r="8" fill="#f59e0b"/>
      </g>
    </g>

    <!-- ================= PULL-UP ================= -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23077;0.25;0.5;0.51923;1" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(0,-30)" filter="url(#softGlow)">
        <line x1="-72" y1="-207" x2="72" y2="-207" stroke="#cbd5e1" stroke-opacity="0.58" stroke-width="5" stroke-linecap="round"/>
        <line x1="-72" y1="-207" x2="-72" y2="-184" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="3"/>
        <line x1="72" y1="-207" x2="72" y2="-184" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="3"/>
        <path d="M-19 -110 Q0 -105 19 -110 L10 -72 Q0 -68 -10 -72 Z" fill="#4ade80" fill-opacity="0.17"/>
        <g fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-22 -207 L-25 -158 L-19 -110 M22 -207 L25 -158 L19 -110 M-19 -110 L-10 -72 M19 -110 L10 -72 M-19 -110 L19 -110 M-10 -72 L10 -72 M-10 -72 L-19 -38 L-17 -18 M10 -72 L19 -38 L17 -18"/>
        </g>
        <circle cx="0" cy="-130" r="8" fill="#f59e0b"/>
        <g fill="#fbbf24"><circle cx="-19" cy="-110" r="3.3"/><circle cx="19" cy="-110" r="3.3"/><circle cx="-10" cy="-72" r="3.3"/><circle cx="10" cy="-72" r="3.3"/></g>
      </g>
    </g>

    <!-- ================= PISTOL SQUAT ================= -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51923;0.75;0.76923;1" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(-14,0)" filter="url(#softGlow)">
        <path d="M-8 -121 Q0 -128 12 -119 L6 -79 Q-1 -74 -9 -78 Z" fill="#4ade80" fill-opacity="0.2"/>
        <g fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 -120 L-6 -78 L30 -42 L0 -5 M-6 -78 L40 -88 L88 -92 M0 -120 L30 -111 L56 -104 M0 -148 L0 -120 M-7 0 L18 0"/>
        </g>
        <circle cx="3" cy="-156" r="8" fill="#f59e0b"/>
        <g fill="#fbbf24">
          <circle cx="0" cy="-120" r="3.3"/><circle cx="-6" cy="-78" r="3.3"/>
          <circle cx="30" cy="-42" r="3.3"/><circle cx="0" cy="-5" r="3.3"/>
          <circle cx="40" cy="-88" r="3.3"/><circle cx="88" cy="-92" r="3.3"/>
        </g>
      </g>
    </g>

    <!-- ================= L-SIT ================= -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.76923;0.98077;1" dur="26s" repeatCount="indefinite"/>
      <g filter="url(#softGlow)">
        <g fill="none" stroke="#cbd5e1" stroke-width="4" stroke-opacity="0.42" stroke-linecap="round">
          <path d="M-30 -70 L-30 0 M30 -70 L30 0"/>
          <path d="M-52 -70 L-12 -70 M12 -70 L52 -70" stroke-width="6"/>
        </g>
        <path d="M-14 -142 Q0 -151 14 -142 L8 -72 Q0 -67 -8 -72 Z" fill="#4ade80" fill-opacity="0.2"/>
        <g fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-14 -142 L-21 -105 L-30 -70 M14 -142 L21 -105 L30 -70 M-14 -142 L0 -72 L48 -72 L112 -72 M14 -142 L0 -68 L48 -68 L112 -68 M0 -164 L0 -142 M-14 -142 L14 -142"/>
        </g>
        <g fill="#fbbf24"><circle cx="-14" cy="-142" r="3.3"/><circle cx="14" cy="-142" r="3.3"/><circle cx="-21" cy="-105" r="3.3"/><circle cx="21" cy="-105" r="3.3"/><circle cx="-30" cy="-70" r="3.3"/><circle cx="30" cy="-70" r="3.3"/></g>
        <circle cx="0" cy="-178" r="8" fill="#f59e0b"/>
      </g>
    </g>

    <!-- ================= MOVE LABELS ================= -->
    <text class="ui move" opacity="1" x="0" y="44" text-anchor="middle">HANDSTAND PUSH-UP
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23077;0.25;0.98077;1" dur="26s" repeatCount="indefinite"/>
    </text>
    <text class="ui move" opacity="0" x="0" y="44" text-anchor="middle">PULL-UP
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23077;0.25;0.5;0.51923;1" dur="26s" repeatCount="indefinite"/>
    </text>
    <text class="ui move" opacity="0" x="0" y="44" text-anchor="middle">PISTOL SQUAT
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51923;0.75;0.76923;1" dur="26s" repeatCount="indefinite"/>
    </text>
    <text class="ui move" opacity="0" x="0" y="44" text-anchor="middle">L-SIT
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.76923;0.98077;1" dur="26s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
