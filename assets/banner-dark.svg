<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Background Canvas Gradients matching Calisthenics Lab -->
    <radialGradient id="bgGlow1" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="70%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="90%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#96a5be" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2c31"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.06)"/>
    </linearGradient>

    <linearGradient id="modalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(35, 38, 44, 0.88)"/>
      <stop offset="100%" stop-color="rgba(20, 22, 26, 0.94)"/>
    </linearGradient>

    <linearGradient id="btnFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .brand-title { font-size: 15px; font-weight: 700; fill: rgba(255,255,255,0.95); letter-spacing: -0.01em; }
    .top-btn { font-size: 14px; font-weight: 600; fill: rgba(255,255,255,0.9); }
    .menu-text { font-size: 14px; font-weight: 500; fill: rgba(255,255,255,0.92); }
    .menu-caret { font-size: 14px; fill: rgba(255,255,255,0.6); }
    .modal-h2 { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .modal-body { font-size: 14px; font-weight: 400; fill: rgba(255,255,255,0.85); line-height: 1.5; }
    .modal-sub { font-size: 13px; font-weight: 400; fill: rgba(255,255,255,0.6); line-height: 1.45; }
    .btn-text { font-size: 15.5px; font-weight: 600; fill: #ffffff; }
    .pill-label { font-size: 13.5px; font-weight: 500; fill: rgba(255,255,255,0.9); }
  </style>

  <!-- Canvas Background (matching body) -->
  <rect width="1200" height="520" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="520" rx="20" fill="url(#bgGlow1)"/>
  <rect width="1200" height="520" rx="20" fill="url(#bgGlow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="20" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- Background Full-Screen Skeleton Tracking Overlay (Mirrored pose behind UI) -->
  <g opacity="0.32" transform="translate(140, 20)">
    <!-- Right side (background user stance) -->
    <circle cx="160" cy="180" r="4.5" fill="#f59e0b"/> <!-- Head/Nose -->
    <!-- Shoulders -->
    <line x1="130" y1="210" x2="190" y2="210" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="210" r="4" fill="#fbbf24"/>
    <circle cx="190" cy="210" r="4" fill="#fbbf24"/>
    <!-- Left Arm -->
    <line x1="130" y1="210" x2="105" y2="270" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="270" r="4" fill="#fbbf24"/>
    <line x1="105" y1="270" x2="85" y2="330" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="85" cy="330" r="3.5" fill="#fbbf24"/>
    <!-- Right Arm -->
    <line x1="190" y1="210" x2="215" y2="270" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="215" cy="270" r="4" fill="#fbbf24"/>
    <line x1="215" y1="270" x2="235" y2="330" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="235" cy="330" r="3.5" fill="#fbbf24"/>
    <!-- Torso / Spine -->
    <line x1="130" y1="210" x2="140" y2="310" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="210" x2="180" y2="310" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="310" x2="180" y2="310" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="140" cy="310" r="4" fill="#fbbf24"/>
    <circle cx="180" cy="310" r="4" fill="#fbbf24"/>
    <!-- Legs -->
    <line x1="140" y1="310" x2="135" y2="395" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="135" cy="395" r="4" fill="#fbbf24"/>
    <line x1="135" y1="395" x2="130" y2="470" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="130" cy="470" r="3.5" fill="#fbbf24"/>
    <line x1="180" y1="310" x2="185" y2="395" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="185" cy="395" r="4" fill="#fbbf24"/>
    <line x1="185" y1="395" x2="190" y2="470" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="190" cy="470" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- ================= TOP BAR (ACTUAL APP UI) ================= -->
  <!-- Top Left: Calisthenics Lab Brand Badge -->
  <g filter="url(#glassShadow)" transform="translate(32, 28)">
    <rect width="168" height="42" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#4ade80"/>
    <text x="38" y="26" class="font-base brand-title">Calisthenics <tspan fill="#4ade80">Lab</tspan></text>
  </g>

  <!-- Top Center: Primary Permission Button ("Allow camera to track body position") -->
  <g filter="url(#glassShadow)" transform="translate(424, 28)">
    <rect width="352" height="42" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="176" y="26" text-anchor="middle" class="font-base top-btn">Allow camera to track body position</text>
  </g>

  <!-- Top Right: Exercise Dropdown Menu ("Squat ▾") -->
  <g filter="url(#glassShadow)" transform="translate(1012, 28)">
    <rect width="156" height="42" rx="14" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="24" y="26" class="font-base menu-text">Squat</text>
    <text x="134" y="26" class="font-base menu-caret">▾</text>
  </g>

  <!-- ================= CENTER READY MODAL (ACTUAL APP UI) ================= -->
  <g filter="url(#modalShadow)" transform="translate(335, 96)">
    <!-- Glass Dialog Card -->
    <rect width="530" height="344" rx="22" fill="url(#modalFill)" stroke="rgba(255,255,255,0.24)" stroke-width="1.2"/>

    <!-- Close 'x' button in corner -->
    <text x="498" y="36" class="font-base" font-size="22" fill="rgba(255,255,255,0.5)">×</text>

    <!-- Dialog Title -->
    <text x="265" y="48" text-anchor="middle" class="font-base modal-h2">Ready to Record</text>

    <!-- Dialog Privacy Text -->
    <text x="265" y="80" text-anchor="middle" class="font-base modal-body">
      This app only records and keeps <tspan font-weight="700" fill="#ffffff">skeletal position</tspan> while doing an exercise.
    </text>
    <text x="265" y="100" text-anchor="middle" class="font-base modal-body">
      It never saves or keeps any video or photos of your face or room.
    </text>

    <!-- Dialog Corner / Other Text -->
    <text x="265" y="128" text-anchor="middle" class="font-base modal-sub">
      You can change the exercise you're tracking in the corner, or leave it at default.
    </text>
    <text x="265" y="146" text-anchor="middle" class="font-base modal-sub">
      If your exercise isn't found, select <tspan font-weight="600" fill="#ffffff">+ Other</tspan> to name it when you end.
    </text>

    <!-- Skeleton Preview Box inside Modal (Canvas preview) -->
    <rect x="75" y="168" width="380" height="96" rx="14" fill="rgba(0,0,0,0.38)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Animated Push-up / Planche Skeleton Canvas Drawing -->
    <g transform="translate(115, 172)">
      <!-- Subtle Ground Level -->
      <line x1="20" y1="78" x2="280" y2="78" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Far Arm (depth) -->
      <line x1="88" y1="36" x2="114" y2="60" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>
      <line x1="114" y1="60" x2="88" y2="78" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="88" cy="36" r="2.5" fill="rgba(251,191,36,0.4)"/>
      <circle cx="114" cy="60" r="2.5" fill="rgba(251,191,36,0.4)"/>
      <circle cx="88" cy="78" r="2.5" fill="rgba(251,191,36,0.4)"/>

      <!-- Far Leg (depth) -->
      <line x1="172" y1="46" x2="204" y2="62" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>
      <line x1="204" y1="62" x2="236" y2="76" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="172" cy="46" r="2.5" fill="rgba(251,191,36,0.4)"/>
      <circle cx="204" cy="62" r="2.5" fill="rgba(251,191,36,0.4)"/>
      <circle cx="236" cy="76" r="2.5" fill="rgba(251,191,36,0.4)"/>

      <!-- Near Torso & Spine -->
      <circle cx="56" cy="38" r="4.5" fill="#f59e0b"/> <!-- Nose/Head -->
      <line x1="56" y1="38" x2="80" y2="40" stroke="#4ade80" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="80" y1="40" x2="164" y2="50" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="40" r="4" fill="#fbbf24"/> <!-- Near Shoulder -->
      <circle cx="164" cy="50" r="4" fill="#fbbf24"/> <!-- Near Hip -->

      <!-- Near Arm (Push-up flexion) -->
      <line x1="80" y1="40" x2="108" y2="64" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="108" cy="64" r="4" fill="#fbbf24"/> <!-- Elbow -->
      <line x1="108" y1="64" x2="80" y2="78" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="78" r="3.5" fill="#fbbf24"/> <!-- Wrist -->

      <!-- Near Leg -->
      <line x1="164" y1="50" x2="198" y2="65" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="198" cy="65" r="4" fill="#fbbf24"/> <!-- Knee -->
      <line x1="198" y1="65" x2="230" y2="78" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="230" cy="78" r="3.5" fill="#fbbf24"/> <!-- Ankle -->
    </g>

    <!-- Action Button ("Begin recording") -->
    <g transform="translate(175, 280)">
      <rect width="180" height="44" rx="14" fill="url(#btnFill)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>
      <text x="90" y="27" text-anchor="middle" class="font-base btn-text">Begin recording</text>
    </g>
  </g>

  <!-- ================= BOTTOM FEATURE BADGES ================= -->
  <g transform="translate(200, 462)">
    <!-- Pill 1: MediaPipe Pose -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="url(#glassFill)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="18" cy="17" r="4" fill="#4ade80"/>
    <text x="94" y="22" text-anchor="middle" class="font-base pill-label">MediaPipe 3D Pose</text>

    <!-- Pill 2: Zero Video Kept -->
    <rect x="186" y="0" width="160" height="34" rx="17" fill="url(#glassFill)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="204" cy="17" r="4" fill="#38bdf8"/>
    <text x="274" y="22" text-anchor="middle" class="font-base pill-label">Zero Video Kept</text>

    <!-- Pill 3: Rep & Form Logic -->
    <rect x="362" y="0" width="160" height="34" rx="17" fill="url(#glassFill)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="380" cy="17" r="4" fill="#fbbf24"/>
    <text x="450" y="22" text-anchor="middle" class="font-base pill-label">Rep &amp; Angle Logic</text>

    <!-- Pill 4: Supabase Cloud -->
    <rect x="538" y="0" width="144" height="34" rx="17" fill="url(#glassFill)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="556" cy="17" r="4" fill="#34d399"/>
    <text x="618" y="22" text-anchor="middle" class="font-base pill-label">Supabase Cloud</text>

    <!-- Pill 5: 100% Open Source -->
    <rect x="698" y="0" width="132" height="34" rx="17" fill="url(#glassFill)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="716" cy="17" r="4" fill="#a78bfa"/>
    <text x="772" y="22" text-anchor="middle" class="font-base pill-label">Open Source</text>
  </g>
</svg>
