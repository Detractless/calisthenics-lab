<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="bgGlowLight" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e8e9ed"/>
    </linearGradient>

    <!-- Browser Window Background -->
    <linearGradient id="winGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfc"/>
    </linearGradient>

    <!-- Glass Icon Badge -->
    <linearGradient id="glassBadgeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="winShadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <clipPath id="winClipLight">
      <rect x="72" y="32" width="1056" height="416" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #111827; letter-spacing: -0.02em; }
    .sub-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #4b5563; letter-spacing: -0.01em; }
    .pill-text-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13.5px; fill: #374151; }
    .tab-text-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #374151; }
    .avatar-text-l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
  </style>

  <!-- Outer Canvas Base -->
  <rect width="1200" height="480" rx="22" fill="url(#bgGradLight)"/>
  <rect width="1200" height="480" rx="22" fill="url(#bgGlowLight)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="22" fill="none" stroke="rgba(0,0,0,0.08)"/>

  <!-- Browser Window Frame -->
  <g filter="url(#winShadowLight)">
    <rect x="72" y="32" width="1056" height="416" rx="16" fill="url(#winGradLight)"/>
  </g>

  <!-- Browser Window Contents (Clipped) -->
  <g clip-path="url(#winClipLight)">
    <!-- Browser Chrome / Tab Bar -->
    <rect x="72" y="32" width="1056" height="42" fill="#ebecef"/>
    <line x1="72" y1="74" x2="1128" y2="74" stroke="rgba(0,0,0,0.08)"/>

    <!-- Traffic Lights -->
    <circle cx="94" cy="53" r="5.5" fill="#ff5f57" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
    <circle cx="112" cy="53" r="5.5" fill="#febc2e" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
    <circle cx="130" cy="53" r="5.5" fill="#28c840" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>

    <!-- Active Tab -->
    <path d="M 152 74 L 158 44 A 6 6 0 0 1 164 38 L 296 38 A 6 6 0 0 1 302 44 L 308 74 Z" fill="#ffffff"/>
    <!-- Small Tab Icon (Pose Node) -->
    <circle cx="174" cy="56" r="4" fill="#16a34a"/>
    <circle cx="174" cy="56" r="1.5" fill="#ffffff"/>
    <text x="185" y="60" class="tab-text-l">Calisthenics Lab</text>
    <!-- Plus Tab Button -->
    <path d="M 322 56 L 332 56 M 327 51 L 327 61" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Navigation / Address Toolbar -->
    <rect x="72" y="74" width="1056" height="38" fill="#f8f9fa"/>
    <line x1="72" y1="112" x2="1128" y2="112" stroke="rgba(0,0,0,0.06)"/>

    <!-- Nav arrows & icons -->
    <path d="M 94 93 L 88 93 M 91 90 L 88 93 L 91 96" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 104 93 L 110 93 M 107 90 L 110 93 L 107 96" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 124 93 A 4 4 0 1 1 127 90 M 127 87 L 127 90 L 130 90" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 144 95 L 144 92 L 148 89 L 152 92 L 152 95 Z M 147 95 L 147 93 L 149 93 L 149 95" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- URL Bar -->
    <rect x="170" y="80" width="700" height="26" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
    <text x="184" y="97" font-family="-apple-system, sans-serif" font-size="12" fill="#4b5563">
      <tspan fill="#16a34a" font-weight="600">https://</tspan>detractless.github.io/calisthenics-lab/
    </text>

    <!-- User Profile Avatar Pill (CD) -->
    <circle cx="1096" cy="93" r="12" fill="#ca8a04"/>
    <text x="1096" y="97" class="avatar-text-l" text-anchor="middle">CD</text>

    <!-- Inner Viewport Background Glow -->
    <radialGradient id="centerGlowLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <rect x="72" y="112" width="1056" height="336" fill="url(#centerGlowLight)"/>

    <!-- App Logo Icon Badge (Centered) -->
    <rect x="556" y="146" width="88" height="88" rx="24" fill="url(#glassBadgeLight)" stroke="rgba(0,0,0,0.08)" stroke-width="1.2"/>

    <!-- Planche / Movement Skeleton Illustration inside Icon -->
    <g transform="translate(566, 156)">
      <!-- Torso & Head -->
      <circle cx="24" cy="46" r="3.5" fill="#d97706"/>
      <line x1="24" y1="46" x2="33" y2="44" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="33" cy="44" r="3" fill="#ca8a04"/>
      <!-- Arm: Shoulder -> Elbow -> Wrist -->
      <line x1="33" y1="44" x2="29" y2="58" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="29" cy="58" r="3" fill="#ca8a04"/>
      <line x1="29" y1="58" x2="34" y2="68" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="34" cy="68" r="3" fill="#ca8a04"/>
      <!-- Spine & Hip -->
      <line x1="33" y1="44" x2="52" y2="38" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="52" cy="38" r="3" fill="#ca8a04"/>
      <!-- Legs: Hip -> Knee -> Ankle -->
      <line x1="52" y1="38" x2="68" y2="33" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="68" cy="33" r="3" fill="#ca8a04"/>
      <line x1="68" y1="33" x2="80" y2="30" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="80" cy="30" r="2.5" fill="#ca8a04"/>
      <!-- Subtle Ground Floor Support line -->
      <line x1="16" y1="69" x2="52" y2="69" stroke="rgba(0,0,0,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Main Title & Tagline -->
    <text x="600" y="280" text-anchor="middle" font-size="40" class="title-l">
      Calisthenics <tspan fill="#16a34a">Lab</tspan>
    </text>
    <text x="600" y="316" text-anchor="middle" font-size="17" class="sub-l">
      Open-source movement tracking &amp; collective pose intelligence.
    </text>

    <!-- Feature Pills in Frosted Glass -->
    <g transform="translate(182, 354)">
      <!-- Pill 1: MediaPipe 3D Pose -->
      <rect x="0" y="0" width="176" height="36" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      <circle cx="20" cy="18" r="4" fill="#16a34a"/>
      <text x="96" y="23" text-anchor="middle" class="pill-text-l">MediaPipe 3D Pose</text>

      <!-- Pill 2: Privacy First (Skeleton Only) -->
      <rect x="190" y="0" width="168" height="36" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      <circle cx="210" cy="18" r="4" fill="#0284c7"/>
      <text x="281" y="23" text-anchor="middle" class="pill-text-l">Zero Video Kept</text>

      <!-- Pill 3: Rep & Form Analysis -->
      <rect x="372" y="0" width="158" height="36" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      <circle cx="392" cy="18" r="4" fill="#d97706"/>
      <text x="458" y="23" text-anchor="middle" class="pill-text-l">Rep &amp; Angle Logic</text>

      <!-- Pill 4: Supabase Shared Library -->
      <rect x="544" y="0" width="152" height="36" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      <circle cx="564" cy="18" r="4" fill="#059669"/>
      <text x="627" y="23" text-anchor="middle" class="pill-text-l">Shared Library</text>

      <!-- Pill 5: 100% Free & Open Source -->
      <rect x="710" y="0" width="126" height="36" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      <circle cx="728" cy="18" r="4" fill="#7c3aed"/>
      <text x="778" y="23" text-anchor="middle" class="pill-text-l">Open Source</text>
    </g>
  </g>

  <!-- Browser Window Outer Border -->
  <rect x="72.5" y="32.5" width="1055" height="415" rx="16" fill="none" stroke="rgba(0,0,0,0.12)"/>
</svg>
